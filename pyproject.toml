[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-prism-mcp"
version = "0.0.0"
description = "Distributable Model Context Protocol server for Blue Prism v7 Enterprise — governed LLM access to the estate over the supported REST API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Lewis Nield" }]
keywords = ["blue-prism", "mcp", "model-context-protocol", "rpa", "v7"]

# Base install is deliberately light: just the MCP runtime and an HTTP client.
# PII scrubbing (Presidio + spaCy, ~1GB model) is an OPTIONAL extra so teams
# without a PII risk, or with their own redaction, are not forced to carry it.
dependencies = [
    "mcp==1.27.2",
    "requests==2.32.5",
]

[project.optional-dependencies]
# Presidio-backed PII scrubbing. Also requires a spaCy model installed
# separately: `python -m spacy download en_core_web_sm` (matches CI; the larger
# en_core_web_lg / _trf models give better PII recall in production).
pii = [
    "presidio-analyzer==2.2.362",
    "presidio-anonymizer==2.2.362",
    "spacy==3.8.14",
]
dev = [
    "pytest==8.3.5",
    "pytest-cov==6.1.1",
    "ruff",
    # Mutation testing — a periodic "are my tests real?" audit, not a per-commit
    # gate. See CONTRIBUTING.md. Pinned because the config schema is version-tied.
    "mutmut==3.6.0",
]

[project.scripts]
# Phase 6 — console entrypoint for stdio transport.
blue-prism-mcp = "blue_prism_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# extend-select keeps ruff's curated defaults (E4/E7/E9 + F) and ADDS flake8-
# bugbear (B) — static catches for a class of latent bugs (mutable default args,
# calls in defaults, except-without-bind, …) that don't show on the happy path.
# Using extend-select rather than select avoids pulling in the *full* E group
# (e.g. E501 line-length), which ruff's defaults deliberately leave to the
# formatter. See CONTRIBUTING.md.
extend-select = ["B"]

[tool.mutmut]
# Mutate the package only (not tests). mutmut copies the source into a mutants/
# working dir and runs the suite against each mutant; survivors flag behaviour
# the tests don't actually pin. Expect equivalent mutants in the survivor list —
# triage by hand, don't chase a 100% kill rate.
source_paths = ["src/blue_prism_mcp/"]
