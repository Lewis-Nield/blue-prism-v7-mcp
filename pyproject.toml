[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-prism-mcp"
version = "0.4.0"
description = "Distributable Model Context Protocol server for Blue Prism v7 Enterprise — governed LLM access to the estate over the supported REST API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Lewis Nield" }]
keywords = ["blue-prism", "mcp", "model-context-protocol", "rpa", "v7"]

# Base install is deliberately light: just the MCP runtime and an HTTP client.
# PII scrubbing (Presidio + spaCy, ~1GB model) is an OPTIONAL extra so teams
# without a PII risk, or with their own redaction, are not forced to carry it.
# Ranges, not exact pins: a distributable library must not fight its host
# environment over transitive versions. Lower bounds are the versions this is
# developed and tested against; upper bounds stop the next major.
dependencies = [
    "mcp>=1.27,<2",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
# Presidio-backed PII scrubbing. Also requires a spaCy model installed
# separately: `python -m spacy download en_core_web_sm` (matches CI; the larger
# en_core_web_lg / _trf models give better PII recall in production).
pii = [
    "presidio-analyzer>=2.2.358,<3",
    "presidio-anonymizer>=2.2.358,<3",
    "spacy>=3.8,<4",
]
dev = [
    "pytest==8.3.5",
    "pytest-cov==6.1.1",
    "ruff",
    # Mutation testing — a periodic "are my tests real?" audit, not a per-commit
    # gate. See CONTRIBUTING.md. Pinned because the config schema is version-tied.
    "mutmut==3.6.0",
]

[project.scripts]
# Console entrypoint: builds the server from the environment and runs the
# stdio transport. See server.py and DEPLOYMENT.md.
blue-prism-mcp = "blue_prism_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["blue_prism_mcp"]
# The `python -m blue_prism_mcp` shim is a three-line delegate to server.main.
# It is exercised by the end-to-end tests (which launch the module as a
# subprocess), but subprocess execution is invisible to in-process coverage,
# so measuring it would force a permanent false gap. Omit it; the E2E proves it.
# (Coverage's own defaults already exclude pragma lines, `...` stub bodies, and
# `if TYPE_CHECKING:` blocks — left untouched here so they keep applying.)
omit = ["*/__main__.py"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# extend-select keeps ruff's curated defaults (E4/E7/E9 + F) and ADDS flake8-
# bugbear (B) — static catches for a class of latent bugs (mutable default args,
# calls in defaults, except-without-bind, …) that don't show on the happy path.
# Using extend-select rather than select avoids pulling in the *full* E group
# (e.g. E501 line-length), which ruff's defaults deliberately leave to the
# formatter. See CONTRIBUTING.md.
extend-select = ["B"]

[tool.mutmut]
# Mutate the package only (not tests). mutmut copies the source into a mutants/
# working dir and runs the suite against each mutant; survivors flag behaviour
# the tests don't actually pin. Expect equivalent mutants in the survivor list —
# triage by hand, don't chase a 100% kill rate.
source_paths = ["src/blue_prism_mcp/"]
# test_handshake.py launches the packaged server as a real subprocess; that does
# not survive mutmut's stream-capturing runner (I/O on a closed file) and it
# pins no production logic the audit measures — it is an end-to-end smoke test.
# Skip it so the baseline clean run and every mutant run stay green.
pytest_add_cli_args = ["--ignore=tests/test_handshake.py"]
