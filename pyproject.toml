[build-system]
# >=77 for PEP 639 licence metadata (SPDX `license` expression + license-files).
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-prism-v7-mcp"
version = "0.20.1"
description = "Distributable Model Context Protocol server for Blue Prism v7 Enterprise — governed LLM access to the estate over the supported REST API."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Lewis Nield" }]
keywords = ["automation", "blue-prism", "mcp", "model-context-protocol", "rpa", "v7"]

# Search facets for the package index. The Python versions are exactly the CI
# matrix — claiming support here means it is tested, not hoped. No `License ::`
# classifier: PEP 639 `license`/`license-files` above are the modern spelling and
# setuptools>=77 rejects the pair.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]

# Base install is deliberately light: just the MCP runtime and an HTTP client.
# PII scrubbing (Presidio + spaCy, ~1GB model) is an OPTIONAL extra so teams
# without a PII risk, or with their own redaction, are not forced to carry it.
# Ranges, not exact pins: a distributable library must not fight its host
# environment over transitive versions. Lower bounds are the versions this is
# developed and tested against; upper bounds stop the next major.
dependencies = [
    "mcp>=1.27,<2",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
# Presidio-backed PII scrubbing. Also requires a spaCy model installed
# separately: `python -m spacy download en_core_web_sm` (matches CI; the larger
# en_core_web_lg / _trf models give better PII recall in production).
pii = [
    "presidio-analyzer>=2.2.358,<3",
    "presidio-anonymizer>=2.2.358,<3",
    "spacy>=3.8,<4",
]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    # Pinned exact now that ruff format --check gates CI: a new ruff's
    # formatter-style changes must not break every open branch overnight.
    "ruff==0.16.0",
    # Same reasoning: a stricter mypy or fresher requests stubs must land as a
    # deliberate bump, not a surprise CI failure.
    "mypy==2.3.0",
    "types-requests==2.33.0.20260712",
    # Mutation testing — a periodic "are my tests real?" audit, not a per-commit
    # gate. See CONTRIBUTING.md. Pinned because the config schema is version-tied.
    "mutmut==3.7.0",
]

[project.urls]
# The sidebar on the package page. Documentation points at DEPLOYMENT.md rather
# than the README, since the README is already the page body.
Homepage = "https://github.com/Lewis-Nield/blue-prism-v7-mcp"
Repository = "https://github.com/Lewis-Nield/blue-prism-v7-mcp"
Documentation = "https://github.com/Lewis-Nield/blue-prism-v7-mcp/blob/main/DEPLOYMENT.md"
Changelog = "https://github.com/Lewis-Nield/blue-prism-v7-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/Lewis-Nield/blue-prism-v7-mcp/issues"

[project.scripts]
# Console entrypoint: builds the server from the environment and runs the
# stdio transport. See server.py and DEPLOYMENT.md.
blue-prism-v7-mcp = "blue_prism_v7_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# PEP 561 marker: the package ships inline type hints, so embedders' type
# checkers (Custera's included) see our signatures instead of Any.
blue_prism_v7_mcp = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["blue_prism_v7_mcp"]
# The `python -m blue_prism_v7_mcp` shim is a three-line delegate to server.main.
# It is exercised by the end-to-end tests (which launch the module as a
# subprocess), but subprocess execution is invisible to in-process coverage,
# so measuring it would force a permanent false gap. Omit it; the E2E proves it.
# (Coverage's own defaults already exclude pragma lines, `...` stub bodies, and
# `if TYPE_CHECKING:` blocks — left untouched here so they keep applying.)
omit = ["*/__main__.py"]

[tool.mypy]
# The gate covers the shipped package plus the release automation; tests stay
# outside it (they are pinned by execution — 100% coverage — not by static
# types). scripts/release.py rewrites five files and pushes a tag, so it earns
# the same static checking as the code it ships.
files = ["src", "scripts"]
# Flag ignores that stop suppressing anything, so upstream fixes (e.g. the
# presidio RecognizerResult split) get cleaned up rather than fossilising.
warn_unused_ignores = true

[tool.ruff]
line-length = 100
# Markdown is outside ruff's remit here. Its default file set grew to include
# *.md, which puts the formatter in charge of the Python blocks in README.md —
# including the column-aligned comments in the embedded-use example, which are
# aligned because a reader scans them, not because a formatter left them there.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# E4/E7/E9 + F is the set ruff itself selects by default; B (flake8-bugbear) is
# the deliberate addition — static catches for a class of latent bugs (mutable
# default args, calls in defaults, except-without-bind, …) that don't show on
# the happy path. The full E group stays out: E501 line-length is the
# formatter's job. See CONTRIBUTING.md.
#
# Listed explicitly rather than inherited via extend-select. Inheriting means a
# ruff release can redefine the standard this repo is held to — 0.16.0 widened
# its defaults by roughly fourteen rule families and turned every open branch
# red overnight. Adopting a rule is a decision with a diff attached; it belongs
# in a commit that argues for it, not in a version bump.
select = ["E4", "E7", "E9", "F", "B"]

[tool.mutmut]
# Mutate the package only (not tests). mutmut copies the source into a mutants/
# working dir and runs the suite against each mutant; survivors flag behaviour
# the tests don't actually pin. Expect equivalent mutants in the survivor list —
# triage by hand, don't chase a 100% kill rate.
source_paths = ["src/blue_prism_v7_mcp/"]
# test_handshake.py launches the packaged server as a real subprocess; that does
# not survive mutmut's stream-capturing runner (I/O on a closed file) and it
# pins no production logic the audit measures — it is an end-to-end smoke test.
# Skip it so the baseline clean run and every mutant run stay green.
pytest_add_cli_args = ["--ignore=tests/test_handshake.py"]
