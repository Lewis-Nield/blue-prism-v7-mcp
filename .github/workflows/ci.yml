name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege, declared here rather than inherited: on a public repo any
# fork's pull request can trigger this workflow, and the default token grant is
# wider than a test run needs.
permissions:
  contents: read

jobs:
  # The lockfile is not interpreter-specific, so this is its own job rather than
  # a fourth step on every matrix leg.
  #
  # Why it exists: the test job installs with pip and never reads uv.lock, so a
  # fully green matrix says nothing about whether the lock still matches
  # pyproject.toml. Dependabot compounds it — it edits manifests only, so every
  # dev-tool bump it lands leaves the lock behind. That is exactly how the lock
  # came to resolve pytest 8.3.5 against a pyproject pinning 9.1.1, with no entry
  # at all for mypy, while CI stayed green throughout.
  #
  # uv is deliberately NOT pinned here. A newer uv re-resolving the lock and
  # failing this check is real information — it means the lock needs
  # regenerating — and unlike the ruff format gate, a failure here blocks
  # nothing a contributor cannot fix with a single `uv lock`.
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Check uv.lock is in sync with pyproject.toml
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv lock --check

  test:
    runs-on: ubuntu-latest
    strategy:
      # Every version a consumer can install on (requires-python >=3.11), so
      # "supported" means tested, not hoped. fail-fast stays on: one broken
      # version almost always means all three are.
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # Actions are pinned by commit SHA, not by tag: a tag is mutable, so a
      # compromised upstream can rewrite it under us. Dependabot keeps the pins
      # (and these trailing version comments) current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (with dev + pii extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pii]"

      # Required only by the [pii] Presidio backend.
      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Lint
        run: ruff check .

      # Formatting drifted twice before this gate existed (v0.8.0 caught one
      # sweep, this workflow's PR caught another) — check, don't trust.
      - name: Format
        run: ruff format --check .

      - name: Type-check
        run: mypy

      - name: Test
        # The coverage gate (Phase 7): 100% on every measured module. The
        # suite has held this since Phase 1; --cov-fail-under makes a drop a
        # build failure rather than a number nobody reads.
        # scripts/ is measured too: release.py automates the release tail, so
        # a bug in it lands a wrong version or a misplaced tag — exactly the
        # class of mistake it exists to prevent.
        run: pytest --cov=blue_prism_v7_mcp --cov=scripts --cov-report=term-missing --cov-fail-under=100

      # Advisories against the versions actually RESOLVED here. Dependencies are
      # ranges and Dependabot only reads manifests, so nothing else in the
      # pipeline looks at what a fresh install would really pull. Run on every
      # matrix leg, since the resolution differs per interpreter.
      #
      # Deliberately non-blocking, and last: an advisory published against a
      # transitive dependency is information, not a reason a release cannot be
      # cut. Read the annotation, decide, act — do not let it brick the build.
      - name: Audit dependencies
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --skip-editable
