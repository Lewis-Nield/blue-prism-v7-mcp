name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Every version a consumer can install on (requires-python >=3.11), so
      # "supported" means tested, not hoped. fail-fast stays on: one broken
      # version almost always means all three are.
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (with dev + pii extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pii]"

      # Required only by the [pii] Presidio backend.
      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Lint
        run: ruff check .

      # Formatting drifted twice before this gate existed (v0.8.0 caught one
      # sweep, this workflow's PR caught another) — check, don't trust.
      - name: Format
        run: ruff format --check .

      - name: Type-check
        run: mypy

      - name: Test
        # The coverage gate (Phase 7): 100% on every measured module. The
        # suite has held this since Phase 1; --cov-fail-under makes a drop a
        # build failure rather than a number nobody reads.
        # scripts/ is measured too: release.py automates the release tail, so
        # a bug in it lands a wrong version or a misplaced tag — exactly the
        # class of mistake it exists to prevent.
        run: pytest --cov=blue_prism_v7_mcp --cov=scripts --cov-report=term-missing --cov-fail-under=100
