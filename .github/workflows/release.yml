name: Release

# Publishing runs on a pushed `v*` tag, which is the tail end of
# scripts/release.py: that script owns the repo side (version sites, CHANGELOG,
# tag, GitHub release), and this workflow owns the PyPI side. They compose —
# neither duplicates the other's work.
#
# The manual trigger exists so the first real publish is never the first time
# this workflow has run. Dispatch it against TestPyPI, confirm the whole path
# works, and only then cut a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

# Read-only by default. The publish job re-declares what it actually needs;
# nothing here should be able to write to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA rather than tag: a tag is mutable, so a compromised
      # upstream can rewrite it under us. Same policy as ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      # The v0.14.0 release shipped with a tag pointing at the pre-merge commit.
      # This makes that class of mistake impossible rather than merely watched
      # for.
      #
      # It reads the version back out of the BUILT wheel's METADATA. Reading
      # pyproject.toml instead would defeat the point entirely: the build is
      # what gets uploaded, so the build is what has to agree with the tag. A
      # source-file check would pass on exactly the mismatch this exists to
      # catch.
      - name: Verify tag matches the built distribution
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, sys, zipfile
          from email.parser import BytesParser

          tag = os.environ["TAG"]
          expected = tag[1:] if tag.startswith("v") else tag

          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              sys.exit(f"expected exactly one wheel in dist/, found {len(wheels)}")

          with zipfile.ZipFile(wheels[0]) as zf:
              name = next(
                  (n for n in zf.namelist() if n.endswith(".dist-info/METADATA")),
                  None,
              )
              if name is None:
                  sys.exit(f"no METADATA inside {wheels[0].name}")
              built = BytesParser().parsebytes(zf.read(name))["Version"]

          if built != expected:
              sys.exit(
                  f"tag/version mismatch: tag {tag} implies {expected!r}, but the "
                  f"built wheel reports {built!r}. The tag is probably on the "
                  f"wrong commit."
              )
          print(f"tag {tag} matches built version {built}")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    # Trusted Publishing binds the environment NAME into the OIDC claim, so a
    # TestPyPI run must use its own environment registered as `testpypi` on
    # TestPyPI. Reusing `pypi` makes the claim mismatch and the upload is
    # rejected. A tag push has no inputs, so it falls through to `pypi`.
    environment: ${{ inputs.target || 'pypi' }}

    permissions:
      # The OIDC token that stands in for a long-lived API token. This is the
      # whole reason there is no PYPI_TOKEN secret on a public repo.
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          repository-url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
